name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/workflows/setup-uv@master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo test --release -- --test-threads=1
      - run: cargo check --all-features
      - run: cargo package -p fbz
      - run: uv pip install --system --config-settings-package fbz:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: pytest -q

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/workflows/setup-uv@master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: AnswerDotAI/workflows/maturin-build@master
        with:
          command: setup
          zig: ${{ runner.os == 'Linux' }}
      - name: Stage native binary
        run: |
          uv pip install --system 'fastws-cli>=0.0.42'
          cargo stage --profile dist ${{ runner.os == 'Linux' && '--zig --manylinux 2_31' || '' }}
      - uses: AnswerDotAI/workflows/maturin-build@master
        with:
          args: --profile dist --out dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate when its version is new
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="fbz") | .version')
          if curl -sf -A "fbz-ci (https://github.com/AnswerDotAI/fbz)" "https://crates.io/api/v1/crates/fbz/$version" >/dev/null; then echo "fbz $version is already published"; else cargo publish -p fbz --no-verify; fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
