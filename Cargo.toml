[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.13"
edition = "2024"

[package]
name = "fbz"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license = "Apache-2.0"
description = "Fast parallel compression and decompression for bzip2, gzip, LZ4, tar, and ZIP"
repository = "https://github.com/AnswerDotAI/fbz"
homepage = "https://github.com/AnswerDotAI/fbz"
documentation = "https://docs.rs/fbz"
include = ["/src/**", "/Cargo.toml", "/README.md", "/DEV.md", "/LICENSE"]

[lib]
name = "fbz"

[[bin]]
name = "fbz"
path = "src/bin/fbz.rs"
test = false

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.fbz]
incremental = true

[profile.release.package.fbz-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.fbz]
incremental = false

[profile.dist.package.fbz-py]
incremental = false

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.1"
memmap2 = "0.9.11"
rayon = "1.12.0"
rgapi = "0.2.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
twox-hash = { version = "2.0.0", default-features = false, features = ["xxhash32"] }
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
crabz2 = { version = "0.4.0", features = ["parallel"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
libc = "0.2.175"
libbz2-rs-sys = { version = "0.2.5", default-features = false, features = ["std"] }
lz4_flex = "0.14.0"
