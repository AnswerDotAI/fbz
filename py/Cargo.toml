[package]
name = "fbz-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
fbz = { path = ".." }
pyo3 = { version = ">=0.30", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = ">=0.29.2"
