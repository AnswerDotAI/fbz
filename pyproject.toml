[build-system]
requires = ["maturin>=1.9.2,<2.0", "fastws-cli>=0.0.20"]
build-backend = "fastws.build_backend"

[project]
name = "fbz"
dynamic = ["version"]
description = "Fast parallel compression and decompression for bzip2, gzip, LZ4, tar, and ZIP"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["fastws-cli>=0.0.20", "fastship>=0.1.8", "maturin>=1.0,<2.0", "pytest"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/fbz"
Repository = "https://github.com/AnswerDotAI/fbz"
Issues = "https://github.com/AnswerDotAI/fbz/issues"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "fbz._core"
data = "target/wheel-data"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.fastws]
native-binaries = true

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
